<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>VARV — About Options</title><style>
*{box-sizing:border-box}body{margin:0;background:#080908;color:#eee;font-family:Arial,sans-serif;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid #30332c}strong{font-size:15px}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;font-size:13px}button{background:transparent;color:#aaa;border:1px solid transparent;padding:10px 16px;cursor:pointer;border-radius:3px}button[aria-pressed=true]{background:#c5ed71;color:#151811}button:focus-visible,a:focus-visible{outline:2px solid #c5ed71;outline-offset:3px}a{color:#ddd;margin-left:auto;text-decoration:none;white-space:nowrap}iframe{width:100%;flex:1;border:0;min-height:0;background:#000}@media(max-width:650px){header{padding:12px;gap:10px;flex-wrap:wrap}nav{order:3;width:100%;gap:2px}button{padding:10px}strong{font-size:13px}}
</style></head><body><header><strong>VARV / About options</strong><nav aria-label="Choose a design"><button aria-pressed="true" data-url="about-test.html">01 Original</button><button aria-pressed="false" data-url="about-direction-1.html">02 Editorial</button><button aria-pressed="false" data-url="about-direction-2.html">03 Collective</button><button aria-pressed="false" data-url="about-direction-3.html">04 Manifesto</button></nav><a id="open" href="about-test.html" target="_blank" rel="noopener">Open full page ↗</a></header><iframe id="preview" title="Original About design preview" src="about-test.html"></iframe><script>
const buttons=[...document.querySelectorAll('button')];buttons.forEach(button=>button.addEventListener('click',()=>{buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const frame=document.getElementById('preview');frame.src=button.dataset.url;frame.title=button.textContent+' About design preview';document.getElementById('open').href=button.dataset.url}));
</script></body></html>
