<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awards — Field Notes Studio</title>
<meta name="description" content="Awards and recognition for Field Notes Studio, arranged by year with links to the projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
*{box-sizing:border-box}
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--bg)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:fixed;top:-60px;left:20px;padding:12px;background:var(--bg);z-index:50}
.skip:focus{top:10px}
main{width:100%;max-width:1440px;min-height:calc(100svh - 150px);margin:0 auto;padding:56px 64px 96px}
.awards-list{max-width:1120px}
.award-year-group + .award-year-group{margin-top:80px}
.award-year{margin:0 0 20px;font-size:28px;font-weight:400;line-height:1.2;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.award-entries{list-style:none;margin:0;padding:0}
.award-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px 48px;align-items:baseline;padding:8px 0;font-size:14px;line-height:1.7}
.award-name,.project-link{min-width:0;overflow-wrap:anywhere}
.project-link{justify-self:start;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:1px;transition:color .2s,text-decoration-color .2s}
.project-link:hover,.project-link:focus-visible{color:var(--accent);text-decoration-color:currentColor}
.awards-status{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
footer{display:flex;justify-content:space-between;gap:20px;padding:25px 34px;border-top:1px solid var(--line);color:var(--muted);font:10px/1.7 var(--mono);letter-spacing:.04em}
@media(max-width:800px){main{padding:44px 28px 80px}.award-row{column-gap:28px}.award-year-group + .award-year-group{margin-top:64px}}
@media(max-width:600px){main{padding:36px 20px 64px}.award-year{font-size:26px;margin-bottom:16px}.award-row{grid-template-columns:minmax(0,1fr);gap:3px;padding:10px 0}.award-year-group + .award-year-group{margin-top:56px}footer{padding:22px 20px;flex-wrap:wrap}footer span:last-child{width:100%}}
@media(prefers-reduced-motion:reduce){.project-link{transition:none}}
</style>
</head>
<body data-page="awards">
<a class="skip" href="#main">Skip to awards</a>
<header class="site-header"><a class="site-brand" href="index.html">Field Notes Studio</a><div class="site-links"><a href="projects.html">Projects</a><a href="awards.html" aria-current="page">Awards</a><a href="about.html">About</a><button id="site-theme" type="button">Daylight ↗</button></div></header>
<main id="main" aria-labelledby="page-title">
<h1 id="page-title" class="sr-only">Awards</h1>
<p id="awards-status" class="awards-status" role="status">Loading awards…</p>
<div id="awards-list" class="awards-list"></div>
<noscript><p class="awards-status">Please enable JavaScript to view awards and project links.</p></noscript>
</main>
<footer><span>© 2025 Field Notes Studio</span><span>Landscape · Ecology · Research</span><span>United States — Shanghai</span></footer>
<script src="assets/project-content.js?v=20261009-hero"></script>
<script src="assets/project-awards.js?v=20261004-text-links"></script>
<script src="assets/site.js"></script>
</body>
</html>
