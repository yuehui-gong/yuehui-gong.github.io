<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graphic options — Field Notes Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#eceee8;color:#26332d;font:13px Arial,sans-serif}.toolbar{padding:14px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #26332d30}strong{font-size:13px}label{display:flex;align-items:center;gap:8px;font-size:11px}select,button{font:12px Arial;color:inherit;background:transparent;border:1px solid #26332d50;padding:8px;border-radius:3px}button{cursor:pointer}.switch{width:58px;height:30px;border:0;border-radius:30px;background:#293a31;padding:3px;position:relative}.switch:after{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}.switch[aria-checked=true]:after{transform:translateX(28px)}.switch[aria-checked=true]{background:#819383}.toolbar small{font-size:10px;color:#53645a}iframe{width:100%;height:calc(100dvh - 115px);border:0;display:block}.sub{padding:10px 20px;display:flex;gap:20px;align-items:center}.sub span{font:11px monospace}a{color:inherit}button:focus-visible,select:focus-visible{outline:2px solid #5973bd;outline-offset:3px}@media(max-width:650px){.toolbar{gap:10px;padding:10px}iframe{height:calc(100dvh - 210px)}.sub{padding:10px;flex-wrap:wrap}}body{height:100dvh;display:flex;flex-direction:column}.toolbar,.sub{flex-shrink:0}iframe{flex:1;min-height:0;height:auto!important}</style></head><body><div class="toolbar"><strong>Field Notes / Color study</strong><label>Page<select id="page"><option value="index">Landing</option><option value="about">About</option><option value="project">Project</option></select></label><label>Palette<select id="palette"><option value="olive">Olive brown</option><option value="forest">Forest</option><option value="slate">Slate blue</option><option value="steel">Blue-gray</option></select></label><label>Accent<select id="accent"><option value="yellow">Yellow</option><option value="orange">Orange</option><option value="lime">Lime</option><option value="blue">Blue</option><option value="teal">Teal</option><option value="terracotta">Terracotta</option></select></label><label>Font<select id="font"><option value="space">Space Grotesk · Current</option><option value="arial">Arial · Neutral sans</option><option value="georgia">Georgia · Serif</option><option value="mono">JetBrains Mono · Technical</option></select></label><label>Graphics<select id="graphics"><option value="none">None</option><option value="organic">Irregular form</option><option value="rectangles">Rectangles</option><option value="editing">Editing / guides</option><option value="underwater">Underwater · Landing only</option></select></label><label>Motion<select id="motion"><option value="static">Static</option><option value="subtle">Subtle</option></select></label><label><span id="mode-label">Night</span><button id="mode" class="switch" role="switch" aria-label="Daylight mode" aria-checked="false"></button></label><button id="share">Copy preview link</button></div><div class="sub"><span id="swatch"></span><small>Experimental palette · Main site unchanged</small></div><iframe id="preview" title="Website palette preview"></iframe><script>
const daylight={olive:{bg:'#ffffff',ink:'#303323',muted:'#656951'},forest:{bg:'#ffffff',ink:'#173d2d',muted:'#536d5c'},slate:{bg:'#ffffff',ink:'#22364f',muted:'#596b83'},steel:{bg:'#ffffff',ink:'#243f46',muted:'#567279'}};
const q=new URLSearchParams(location.search),state={page:q.get('page')||'index',palette:q.get('palette')||'olive',accent:q.get('accent')||'yellow',mode:q.get('mode')||'night',graphics:q.get('graphics')||'none',motion:q.get('motion')||'static',font:q.get('font')||'space'};const frame=document.getElementById('preview');const colors={olive:'#292b22',forest:'#182b26',slate:'#242e3c',steel:'#263235'},accents={yellow:'#f3e84c',orange:'#ff9656',lime:'#c0ed65',blue:'#76b7ff',teal:'#55ddce',terracotta:'#e2895c'};
for(const key of ['page','palette','accent','graphics','motion','font']){const el=document.getElementById(key);el.value=state[key];if(!el.value){el.selectedIndex=0;state[key]=el.value}el.onchange=()=>{state[key]=el.value;if(key==='page'&&state.page!=='index'&&state.graphics==='underwater'){state.graphics='none';document.getElementById('graphics').value='none'}update(key==='page')}}function update(load=false){if(state.graphics==='underwater'&&state.page!=='index'){state.page='index';document.getElementById('page').value='index';load=true;}document.getElementById('mode').setAttribute('aria-checked',state.mode==='day');document.getElementById('mode-label').textContent=state.mode==='day'?'Day':'Night';history.replaceState(null,'','?'+new URLSearchParams(state));document.getElementById('swatch').textContent=(state.mode==='day'?daylight[state.palette].bg:colors[state.palette])+' / '+accents[state.accent];if(load)frame.src=state.page+'-preview.html'+(state.page==='project'?'?slug=YG_261002_Berlin_2026':'');else frame.contentWindow.postMessage({type:'palette-preview',...state},location.origin)}document.getElementById('mode').onclick=()=>{state.mode=state.mode==='day'?'night':'day';update()};window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='palette-ready')update();if(e.data?.type==='preview-toggle'){state.mode=state.mode==='day'?'night':'day';update();}if(e.data?.type==='preview-page'){state.page=e.data.page;if(state.page!=='index'&&state.graphics==='underwater'){state.graphics='none';document.getElementById('graphics').value='none'}document.getElementById('page').value=state.page;update(true)}});document.getElementById('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('share').textContent='Copied'}catch{prompt('Copy this preview link',location.href)}};update(true);
</script></body></html>
