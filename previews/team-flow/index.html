<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team flow — preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#080908;color:#eee;font-family:Arial,sans-serif}header{padding:24px 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292b28}a{color:inherit}button{background:none;color:inherit;border:1px solid #555;padding:10px 16px;cursor:pointer}h1{font-size:20px;font-weight:400;margin:0}header p{font-size:12px;color:#999}#field{position:relative;height:calc(100vh - 110px);min-height:640px;overflow:hidden;margin:0 4vw;mask-image:linear-gradient(transparent,#000 35px,#000 calc(100% - 35px),transparent)}article{position:absolute;top:0;left:0;width:24%;will-change:transform;padding:12px 0 45px}article img{width:100%;aspect-ratio:1;object-fit:cover;display:block}h2{font-size:15px;font-weight:400;margin:12px 0}article p{font-size:12px;line-height:1.65;color:#babfb7;margin:0 0 14px}article:focus-visible{outline:1px solid #c7b59a;outline-offset:6px}#status{position:fixed;bottom:9px;right:4vw;font-size:11px;color:#aaa;background:#080908;padding:4px} @media(max-width:700px){header{gap:20px}article{width:42%}article p{font-size:12px}#field{min-height:600px}}@media(prefers-reduced-motion:reduce){#field{height:auto;overflow:visible;display:flex;flex-wrap:wrap;gap:7%;mask-image:none}article{position:relative;width:43%;transform:none!important}}
</style><header><div><h1>The team</h1><p>Motion study · hover a profile to pause · click to hold</p></div><button id="toggle" aria-pressed="false">Pause motion</button></header><main id="field" aria-label="Team biographies"></main><div id="status" role="status">Loading profiles…</div><script>
(async()=>{
const field=document.querySelector('#field'),toggle=document.querySelector('#toggle'),status=document.querySelector('#status');
const base='../../content/about/';const read=async url=>{const r=await fetch(url);if(!r.ok)throw Error(r.status);return r.json()};
try{
const config=await read(base+'index.json');const profiles=await Promise.all(config.members.map(async id=>({id,...await read(base+'team/'+id+'/profile.json')})));
const cards=profiles.map(p=>{const el=document.createElement('article');el.tabIndex=0;el.setAttribute('aria-label',p.name);const img=new Image();img.src=base+'team/'+p.id+'/'+p.portraitA;img.alt=p.portraitAlt||p.name;img.decoding='async';const name=document.createElement('h2');name.textContent=p.name;el.append(img,name);for(const paragraph of p.bio||[]){const text=document.createElement('p');text.textContent=paragraph;el.append(text)}field.append(el);return el});
await Promise.all(cards.map(c=>c.querySelector('img').decode().catch(()=>{})));
let held=false,hover=false,focus=false,travel=0,last=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function state(){const stopped=held||hover||focus||reduced.matches;toggle.textContent=held?'Resume motion':'Pause motion';toggle.setAttribute('aria-pressed',String(held));status.textContent=reduced.matches?'Reduced motion · static view':stopped?'Paused · read at your own pace':'Slow flow · downward / upward / downward';return stopped}
toggle.onclick=()=>{held=!held;state()};cards.forEach(c=>{c.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){hover=true;state()}});c.addEventListener('pointerleave',()=>{hover=false;state()});c.addEventListener('click',()=>{held=true;state()})});field.addEventListener('focusin',()=>{focus=true;state()});field.addEventListener('focusout',e=>{focus=field.contains(e.relatedTarget);state()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){held=false;document.activeElement.blur();state()}});
let stride=0,lanes=3,H=0;function measure(){H=field.clientHeight;lanes=innerWidth<700?2:3;stride=Math.max(H,...cards.map(c=>c.offsetHeight))+120}measure();window.addEventListener('resize',measure);
function frame(now){const dt=Math.min((now-last)/1000||0,.05);last=now;if(!state()&&!document.hidden)travel+=dt*18;
if(!reduced.matches){const cycle=stride*Math.ceil(cards.length/lanes);cards.forEach((c,i)=>{const lane=i%lanes;const slot=Math.floor(i/lanes);const phase=(slot*stride+travel+lane*190)%cycle;const y=lane===1?H-phase:phase-stride;const x=lane*(field.clientWidth-c.offsetWidth)/(lanes-1);c.style.transform=`translate3d(${x}px,${y}px,0)`})}requestAnimationFrame(frame)}requestAnimationFrame(frame);
}catch(e){status.textContent='Unable to load profiles. Please reload.';console.error(e)}
})();
</script></html>
